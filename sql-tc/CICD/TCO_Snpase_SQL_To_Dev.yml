# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - main

variables:
  - name: BuildConfiguration
    value: release
  - name: BuildPlatform
    value: any cpu
name: TCO_Synapse_SQL_To_Dev_$(Date:yyyyMMdd_HHmm)$(Rev:.r)


stages:
  - template: sqldb.template.yml
    parameters:
      environmentObjects:
        - environmentName: "dev"
          locationCode: ["auea"]
