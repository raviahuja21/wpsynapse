parameters:
  - name: environmentObjects
    type: object
  - name: serviceName
    type: string
stages:
  - ${{ each environmentObject in parameters.environmentObjects }}:
      - ${{ each locationCode in environmentObject.locationCode }}:
          - stage: build_sql_${{ parameters.serviceName }}_${{ locationCode }}_${{ environmentObject.environmentName }}
            displayName: SQL Build(${{ locationCode }} - ${{ environmentObject.environmentName }})
            dependsOn: []
            jobs:
              - template: ../jobs/sql_build_job.yml
                parameters:
                  environmentName: ${{ environmentObject.environmentName }}
                  serviceName: ${{ parameters.serviceName }}
                  locationCode: ${{ locationCode }}
